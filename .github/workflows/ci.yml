name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  # No deploy job to protect, so a newer commit should supersede an in-flight branch run —
  # but never cancel a main or tag run (an unconditional true would cancel those too).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore DiagnosticExplorer.slnx
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build DiagnosticExplorer.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test DiagnosticExplorer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --results-directory ./TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
