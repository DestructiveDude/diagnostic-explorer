name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: fixportal-dev
        type: choice
        options:
          - fixportal-dev
          - fixportal-prod

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  # true: with push on all branches + PRs there is no deploy job to protect, so a newer
  # commit on the same ref should supersede an in-flight run rather than stack redundant ones.
  cancel-in-progress: true

jobs:
  backend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Lint workflow
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          shellcheck: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DiagnosticExplorer.slnx
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build DiagnosticExplorer.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test DiagnosticExplorer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
