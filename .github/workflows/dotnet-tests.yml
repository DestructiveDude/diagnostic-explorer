# Unit tests for the .NET core library and diagnostic service.
#
# Runs both xUnit v3 suites directly so the job stays on Ubuntu without building
# the Windows-only WidgetSample.
name: dotnet-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/dotnet-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  unit-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test Core
        run: dotnet test tests/DiagnosticExplorer.UnitTests/DiagnosticExplorer.UnitTests.csproj --configuration Release

      - name: Test Service
        run: dotnet test tests/DiagnosticService.UnitTests/DiagnosticService.UnitTests.csproj --configuration Release
