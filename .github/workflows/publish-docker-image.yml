# Build and publish the DiagnosticExplorer container image to GitHub
# Container Registry (ghcr.io/<owner>/<repo>).
#
# Triggers:
#   - push to main                       -> publish, tagged `latest` + `sha-<short>` + `main`
#   - push of a v*.*.* git tag           -> publish, tagged with the semver
#   - workflow_dispatch                  -> publish on demand from any ref
#   - pull_request against main          -> build only (no push) to validate
#                                           the Dockerfile / SPA build still works
#
# Authentication: the built-in GITHUB_TOKEN with `packages: write` permission;
# no external secrets required.
#
# Image lives at: ghcr.io/${{ github.repository_owner }}/diagnostic-explorer
# Visibility inherits the source repo on first publish (public repo ->
# public package, private repo -> private package). Override at any
# time from the package's settings page on GitHub.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/diagnostic-explorer

jobs:
  build-and-push:
    name: Publish Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: diagnostics-web/package-lock.json

      - name: Frontend validation
        working-directory: diagnostics-web
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Set up Docker Buildx
        # Blacksmith v2 caching requires a Blacksmith runner and persistent builder. This job is
        # still on ubuntu-latest, so retain the GHA cache until a runner migration is benchmarked.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}
