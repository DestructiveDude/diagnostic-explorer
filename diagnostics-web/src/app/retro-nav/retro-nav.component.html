<div class="h-full overflow-auto p-3 flex flex-col gap-3">

  <div class="field">
    <span class="lbl">Max Records</span>
    <p-select [(ngModel)]="model.maxRecords" [options]="maxRecordOptions"
              optionLabel="label" optionValue="value" styleClass="w-full" />
  </div>

  <div class="field">
    <span class="lbl">Min Level</span>
    <p-select [(ngModel)]="model.minLevel" [options]="minLevelOptions"
              optionLabel="label" optionValue="value" styleClass="w-full" />
  </div>

  <div class="field">
    <span class="lbl">Machine</span>
    <input pInputText [(ngModel)]="model.machine" class="w-full" placeholder="any" />
  </div>

  <div class="field">
    <span class="lbl">Process</span>
    <input pInputText [(ngModel)]="model.process" class="w-full" placeholder="any" />
  </div>

  <div class="field">
    <span class="lbl">User</span>
    <input pInputText [(ngModel)]="model.user" class="w-full" placeholder="any" />
  </div>

  <div class="field">
    <span class="lbl">Message</span>
    <input pInputText [(ngModel)]="model.message" class="w-full" placeholder="any" />
  </div>

  <div class="field">
    <span class="lbl">Date</span>
    <p-datepicker [(ngModel)]="model.date" dateFormat="yy-mm-dd"
                  [showIcon]="true" styleClass="w-full" appendTo="body" />
  </div>

  <div class="grid grid-cols-2 gap-2">
    <div class="field">
      <span class="lbl">Time</span>
      <p-select [(ngModel)]="model.time" [options]="timeOptions"
                optionLabel="label" optionValue="value" styleClass="w-full" />
    </div>
    <div class="field">
      <span class="lbl">Window</span>
      <p-select [(ngModel)]="model.hours" [options]="hourOptions"
                optionLabel="label" optionValue="value" styleClass="w-full" />
    </div>
  </div>

  @if (model.currentSearchId) {
    <p-progressbar [value]="model.percentComplete * 100" />
  }

  <div class="flex items-center justify-between pt-2">
    <div class="flex items-center">
      <p-button label="Reset" [text]="true" severity="secondary" (onClick)="model.reset()" />
      @if (model.supportsDelete) {
        <p-button label="Delete" [text]="true" severity="danger" [disabled]="!model.canDelete" (onClick)="model.delete()" />
      }
    </div>
    <p-button [label]="model.currentSearchId ? 'Cancel' : 'Search'" (onClick)="model.search()" />
  </div>

</div>
