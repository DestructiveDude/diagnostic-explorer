<div class="h-full flex flex-col min-h-0">
  <p-tabs value="detail" class="evt-tabs flex-1 flex flex-col min-h-0">
    <p-tablist>
      <p-tab value="detail">Detail</p-tab>
      <p-tab value="trace">Trace Scope</p-tab>
      <button class="ml-auto mr-2 text-[color:var(--label)] hover:text-white" (click)="closed.emit()">&#x2715;</button>
    </p-tablist>
    <p-tabpanels class="flex-1 min-h-0">
      <p-tabpanel value="detail">
        @if (event; as e) {
          <div class="detail-body">
            <div class="meta">
              <span class="meta-item"><span class="dk">Date</span><span class="dv">{{ e.date | date:'yyyy-MM-dd HH:mm:ss' }}</span></span>
              <span class="meta-item"><span class="dk">Level</span><span class="dv lvl">{{ e.level | levelName }}</span></span>
              @if (e.machine) {
                <span class="meta-item"><span class="dk">Machine</span><span class="dv">{{ e.machine }}</span></span>
              }
              @if (e.user) {
                <span class="meta-item"><span class="dk">User</span><span class="dv">{{ e.user }}</span></span>
              }
            </div>
            <pre class="bd">{{ e.displayText }}</pre>
          </div>
        }
      </p-tabpanel>
      <p-tabpanel value="trace">
        @if (event?.region; as scope) {
          <app-trace-scope [node]="scope" class="block p-2" />
        } @else {
          <div class="h-full flex items-center justify-center text-[color:var(--label)] italic text-sm">No trace scope</div>
        }
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
