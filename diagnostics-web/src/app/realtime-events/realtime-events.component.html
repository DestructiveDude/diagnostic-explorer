<div class="max-h-80 grid min-h-20 overflow-auto realtime-events">

  @if (sink?.filteredEvents?.length == 0) {
    <span class="place-self-center">No events</span>
  }

  @if (sink && sink?.filteredEvents?.length) {
    <p-table [value]="sink.filteredEvents" size="small" styleClass="w-full">
      <ng-template #header>
        <tr>
          <th class="pl-2">Id</th>
          <th class="pl-2">Date</th>
          <th class="pl-2">Level</th>
          <th class="pl-2 w-full">Message</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr (mouseover)="realtime.handleMouseOver(item, $event)"
            (click)="realtime.setCurrentEvent(item)"
            class="cursor-pointer h-6 text-black noselect event-level-{{item.level | levelName | lowercase}}"
            [class.font-bold]="item.isSelected">
          <td class="pl-2">{{ item.id }}</td>
          <td class="pl-2 whitespace-nowrap">{{ item.date | date:'d MMM yyy HH:mm:ss' }}</td>
          <td class="pl-2 pr-2">{{ item.level | levelName }}</td>
          <td class="pl-2 pr-2 w-full">{{ item.message }}</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
