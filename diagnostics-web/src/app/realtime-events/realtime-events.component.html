<div class="overflow-y-auto border border-[var(--border)] rounded realtime-events" style="max-height: 300px;">
  @if (!sink?.filteredEvents?.length) {
    <div class="p-4 text-center text-[var(--label)]">No events</div>
  } @else {
    <table>
      <thead class="sticky top-0 z-10">
        <tr>
          <th class="w-20">Id</th>
          <th class="w-44 whitespace-nowrap">Date</th>
          <th class="w-20">Level</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody>
        @for (event of sink!.filteredEvents; track event) {
          <tr class="event-level-{{event.level | levelName | lowercase}} cursor-pointer"
              [class.event-row-selected]="event.isSelected"
              (mousedown)="realtime.setCurrentEvent(event)"
              (mouseover)="realtime.handleMouseOver(event, $event)">
            <td>{{ event.id }}</td>
            <td class="whitespace-nowrap">{{ event.date | date:'yyyy-MM-dd HH:mm:ss' }}</td>
            <td>{{ event.level | levelName }}</td>
            <td>{{ event.message }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
