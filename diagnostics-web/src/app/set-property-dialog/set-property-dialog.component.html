<div class="flex flex-col gap-3 p-1">
  <label class="text-xs uppercase tracking-wide text-[var(--label)]">{{ text }}</label>
  <input pInputText [(ngModel)]="value" (keyup)="handleKeyUp($event)" class="w-full" autofocus />
  <div class="flex justify-end gap-2 pt-2">
    <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancelClick()" />
    <p-button label="OK" (onClick)="onOkClick()" />
  </div>
</div>
